!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XP Arena</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: radial-gradient(circle at bottom, #0d0d2b, #000);
      overflow: hidden;
      text-align: center;
      color: white;
    }

    /* Tiny twinkling stars ✦ */
    .star {
      position: absolute;
      font-size: 5px; /* smaller stars */
      color: #fffacd;
      opacity: 0.7;
      text-shadow: 0 0 4px #fff, 0 0 6px #ff80ff;
      animation: twinkle 2s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.7) rotate(0deg); }
      100% { opacity: 1; transform: scale(1) rotate(20deg); }
    }

    /* Welcome Section */
    .welcome {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      z-index: 2;
    }

    .speech {
      background: #fff;
      color: #333;
      padding: 15px 20px;
      border-radius: 20px;
      max-width: 360px;
      font-size: 20px;
      font-weight: bold;
      position: relative;
      margin-bottom: 20px;
    }
    .speech:after {
      content: "";
      position: absolute;
      bottom: -20px;
      left: 50%;
      margin-left: -10px;
      border-width: 10px;
      border-style: solid;
      border-color: white transparent transparent transparent;
    }

    .btn {
      padding: 15px 30px;
      background: #ff4081;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 22px;
      font-weight: bold;
      transition: transform 0.2s, background 0.3s;
      box-shadow: 0px 0px 20px #ff4081;
    }
    .btn:hover {
      background: #ff1a66;
      transform: scale(1.1);
    }

    /* Login Section */
    .login {
      display: none;
      padding: 40px;
      animation: fadeIn 1s ease forwards;
      z-index: 2;
      position: relative;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    input {
      display: block;
      margin: 15px auto;
      padding: 12px;
      width: 280px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      text-align: center;
      box-shadow: 0px 0px 10px #ff80ab;
    }
    .submit {
      background: #00c853;
      box-shadow: 0px 0px 20px #00e676;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }
    .submit:hover {
      background: #00a944;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Twinkling Stars -->
  <div id="stars"></div>

  <!-- Welcome Section -->
  <div class="welcome" id="welcome">
    <div class="speech" id="speechText">
      heyyy! 🌌 Welcome to <strong>XP Arena</strong>!  
      Let’s blast off into fun together! 🚀
    </div>
    <button class="btn" onclick="showLogin()">Enter the Arena 🎮</button>
  </div>

  <!-- Login Section -->
  <div class="login" id="login">
    <h2>⚡ Login to XP Arena ⚡</h2>
    <form>
      <input type="text" placeholder="✨ Your Name" required>
      <input type="text" placeholder="🎓 Class of Study" required>
      <input type="tel" placeholder="📱 Phone Number" required>
      <button type="submit" class="btn submit">Let’s Go! 🚀</button>
    </form>
  </div>

  <script>
    function showLogin() {
      document.getElementById("welcome").style.display = "none";
      document.getElementById("login").style.display = "block";
      speakWelcome();
    }

    // Generate smaller ✦ twinkling stars
    const starContainer = document.getElementById("stars");
    for (let i = 0; i < 100; i++) {
      let star = document.createElement("div");
      star.className = "star";
      star.innerHTML = "✦";
      star.style.top = Math.random() * 100 + "vh";
      star.style.left = Math.random() * 100 + "vw";
      star.style.fontSize = (4 + Math.random() * 2) + "px"; // very small stars
      star.style.animationDuration = (1.5 + Math.random() * 2.5) + "s";
      starContainer.appendChild(star);
    }

    // Softer, cuter voice
    function speakWelcome() {
      let text = "heyyy! Welcome to XP Arena! Let's blast off into fun together!";
      let msg = new SpeechSynthesisUtterance(text);
      msg.pitch = 1.1;   // slightly higher pitch (cute)
      msg.rate = 0.7;    // slower, calmer pace
      msg.volume = 0.5;  // softer voice
      msg.lang = "en-US";
      window.speechSynthesis.speak(msg);
    }
  </script>
</body>
</html>

    <button type="submit">Login</button>
  </form>

  <script>
    function goToHomepage(event) {
      event.preventDefault();
      window.location.href = "index.html";
    }

</body>
</html>
